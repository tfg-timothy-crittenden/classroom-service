spring.sql.init.mode=always


spring.docker.compose.enabled=false

# Don't look for schema.sql; Hibernate will create/update tables in dev
spring.sql.init.schema-locations=

# Ensure Hibernate creates the schema before data.sql runs
spring.jpa.defer-datasource-initialization=true

# Hibernate manages schema in dev
spring.jpa.hibernate.ddl-auto=update

# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false

# Suppress security autoconfiguration warnings in dev (we're using permitAll)
logging.level.org.springframework.boot.autoconfigure.security=ERROR

eureka.instance.metadata-map.grpc-enabled=true
eureka.instance.metadata-map.grpc-port=${CLASSROOM_GRPC_PORT:9093}
eureka.instance.metadata-map.grpc-host=${CLASSROOM_GRPC_HOST:${eureka.instance.hostname:host.docker.internal}}

# Local database defaults can be overridden via env vars when needed
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/classroom_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}


# Keep Flyway pointed to the same database explicitly
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/classroom_db}}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:myuser}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:secret}}

# Kafka configuration for local/dev execution
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

classroom.kafka.material-deleted-topic=material.deleted.v1
classroom.kafka.material-deleted-group-id=classroom-service-material-deleted
classroom.kafka.material-titles-updated-topic=material.titles.updated.v1
classroom.kafka.material-titles-updated-group-id=classroom-service-material-titles-updated
classroom.kafka.user-teacher-role-revoked-topic=user.teacher-role-revoked.v1
classroom.kafka.user-teacher-role-revoked-group-id=classroom-service-user-teacher-role-revoked


security.internal.api-key=${SECURITY_INTERNAL_API_KEY:test123}

# Ensure /api paths go to controllers, not static resource handler
spring.mvc.static-path-pattern=/static/**
spring.web.resources.static-locations=classpath:/static/

