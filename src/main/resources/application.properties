spring.application.name=classroom-service
spring.cloud.config.enabled=false
server.port=8083
springdoc.api-docs.version=openapi_3_1

spring.docker.compose.enabled=false

logging.level.com.netflix.discovery=DEBUG
logging.level.org.springframework.cloud.netflix.eureka=DEBUG
logging.level.org.springframework.core.env=DEBUG

eureka.instance.hostname=host.docker.internal
eureka.instance.nonSecurePort=8083
eureka.instance.preferIpAddress=false
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.metadata-map.grpc-enabled=true
eureka.instance.metadata-map.grpc-port=${CLASSROOM_GRPC_PORT:9093}
# Default uses eureka.instance.hostname (host.docker.internal) ? works inside Docker.
# When running both services locally outside Docker, uncomment the line below:
 eureka.instance.metadata-map.grpc-host=localhost
#eureka.instance.metadata-map.grpc-host=${CLASSROOM_GRPC_HOST:${eureka.instance.hostname:host.docker.internal}}

security.internal.api-key=${SECURITY_INTERNAL_API_KEY:test123}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/classroom_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:myuser}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret}
spring.flyway.baseline-on-migrate=true
spring.flyway.url=${SPRING_FLYWAY_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/classroom_db}}
spring.flyway.user=${SPRING_FLYWAY_USER:${SPRING_DATASOURCE_USERNAME:myuser}}
spring.flyway.password=${SPRING_FLYWAY_PASSWORD:${SPRING_DATASOURCE_PASSWORD:secret}}

classroom.http-authorization.enabled=${CLASSROOM_HTTP_AUTHORIZATION_ENABLED:false}
classroom.grpc.enabled=${CLASSROOM_GRPC_ENABLED:true}
classroom.grpc.port=${CLASSROOM_GRPC_PORT:9093}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

classroom.kafka.material-deleted-topic=material.deleted.v1
classroom.kafka.material-deleted-group-id=classroom-service-material-deleted
classroom.kafka.material-titles-updated-topic=material.titles.updated.v1
classroom.kafka.material-titles-updated-group-id=classroom-service-material-titles-updated
classroom.kafka.user-teacher-role-revoked-topic=user.teacher-role-revoked.v1
classroom.kafka.user-teacher-role-revoked-group-id=classroom-service-user-teacher-role-revoked

