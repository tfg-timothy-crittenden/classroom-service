syntax = "proto3";

package classroom.authorization.v1;

option java_multiple_files = true;
option java_package = "com.timcritt.tfg.infrastructure.grpc.protov1";
option java_outer_classname = "ClassroomAuthorizationV1Proto";

service ClassroomAuthorizationService {
  rpc CheckMaterialAccess(CheckMaterialAccessRequest) returns (CheckMaterialAccessResponse);
}

message CheckMaterialAccessRequest {
  string user_id = 1;
  int64 material_id = 2;
  string action = 3;
}

message CheckMaterialAccessResponse {
  bool allowed = 1;
  string reason = 2;
  string effective_role = 3;
}

